openapi: 3.0.3
info:
  title: Dayflow HRMS API
  version: 1.1.0
  description: Canonical frontend/backend API contract aligned with the backend plan and project documentation.

x-contract-changelog:
  - date: "2026-08-22"
    version: 1.1.0
    changes:
      - Added employee detail and change-request rejection endpoints.
      - Added leave list, self-list, and rejection endpoints.
      - Added administrator payroll detail and onboarding progress/task endpoints.
      - Added gamification points and badges endpoints.
      - Replaced GET /notifications with GET /notifications/me and added read/preferences endpoints.
      - Replaced specialized /simulate/* routes with POST /simulation/run and added simulation history.
      - Replaced POST /chatbot/ask with session, message, and history endpoints.
      - Backend route choices take precedence where backend/README.md and older planning documents differ.

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a new employee account and generate credentials
      x-access: Admin/HR
      responses:
        "201":
          description: Employee account created

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue a JWT
      x-access: Public
      responses:
        "200":
          description: Authentication successful
        "401":
          description: Invalid credentials

  /employees:
    get:
      tags: [Employee]
      summary: List employee cards
      description: Results are scoped to the current user for the Employee role.
      x-access: All (scoped)
      responses:
        "200":
          description: Employee cards returned

  /employees/{id}:
    get:
      tags: [Employee]
      summary: Get an employee profile by ID
      description: Returns a view appropriate to the caller's role and relationship to the employee.
      x-access: All (scoped)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Employee profile returned
        "404":
          description: Employee not found

  /employees/{id}/self-serve:
    patch:
      tags: [Employee]
      summary: Instantly update low-risk employee fields
      x-access: Self
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Employee profile updated

  /employees/{id}/request-edit:
    patch:
      tags: [Employee]
      summary: Request a verified-field edit
      x-access: Self
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Change request created

  /employees/change-requests:
    get:
      tags: [Employee]
      summary: List pending employee edit requests with diffs
      x-access: Admin/HR
      responses:
        "200":
          description: Pending change requests returned

  /employees/change-requests/{id}/approve:
    post:
      tags: [Employee]
      summary: Approve and apply an employee edit request
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Change request approved and applied

  /employees/change-requests/{id}/reject:
    post:
      tags: [Employee]
      summary: Reject an employee edit request with a reason
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Change request rejected

  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Mark employee check-in
      x-access: Self
      responses:
        "201":
          description: Check-in recorded

  /attendance/check-out:
    post:
      tags: [Attendance]
      summary: Mark check-out and calculate work and extra hours
      x-access: Self
      responses:
        "200":
          description: Check-out recorded

  /attendance/me:
    get:
      tags: [Attendance]
      summary: Get the current employee's daily or weekly attendance
      x-access: Self
      responses:
        "200":
          description: Attendance view returned

  /attendance:
    get:
      tags: [Attendance]
      summary: Get filterable attendance for all employees
      x-access: Admin/HR
      responses:
        "200":
          description: Attendance records returned

  /leave/apply:
    post:
      tags: [Leave]
      summary: Submit a standard leave request
      x-access: Self
      responses:
        "201":
          description: Pending leave request created

  /leave/apply/emergency:
    post:
      tags: [Leave]
      summary: Submit an emergency leave request
      x-access: Self
      responses:
        "201":
          description: Provisional emergency leave created

  /leave/me:
    get:
      tags: [Leave]
      summary: Get the current employee's leave requests
      x-access: Self
      responses:
        "200":
          description: Leave requests returned

  /leave:
    get:
      tags: [Leave]
      summary: Get filterable leave requests for all employees
      x-access: Admin/HR
      responses:
        "200":
          description: Leave requests returned

  /leave/{id}/approve:
    post:
      tags: [Leave]
      summary: Approve leave and update the employee balance
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Leave approved and balance updated

  /leave/{id}/reject:
    post:
      tags: [Leave]
      summary: Reject a leave request with a comment
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Leave request rejected

  /leave/{id}/flag-provisional:
    post:
      tags: [Leave]
      summary: Flag provisional emergency leave for retroactive review
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Provisional leave flagged

  /payroll/me:
    get:
      tags: [Payroll]
      summary: Get the current employee's salary breakdown
      x-access: Self
      responses:
        "200":
          description: Salary breakdown returned

  /payroll/{employee_id}:
    get:
      tags: [Payroll]
      summary: Get an employee's complete payroll details
      x-access: Admin
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Payroll details returned
    patch:
      tags: [Payroll]
      summary: Request payroll field changes with a 30-day effective period
      x-access: Admin
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "201":
          description: Payroll change requests created

  /payroll/{employee_id}/correct:
    post:
      tags: [Payroll]
      summary: Apply an immediate payroll correction
      x-access: Admin
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Payroll correction applied and flagged

  /payroll/change-requests/{id}/acknowledge:
    post:
      tags: [Payroll]
      summary: Acknowledge receipt of an upcoming payroll change
      x-access: Self
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payroll change acknowledged

  /onboarding/me:
    get:
      tags: [Onboarding]
      summary: Get the current new hire's checklist and progress
      x-access: Self
      responses:
        "200":
          description: Onboarding checklist returned

  /onboarding/tasks/{id}:
    patch:
      tags: [Onboarding]
      summary: Update the status of an onboarding task
      x-access: Self
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Onboarding task updated

  /onboarding/{employee_id}:
    get:
      tags: [Onboarding]
      summary: Get onboarding progress for an employee
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: Employee onboarding progress returned

  /gamification/leaderboard:
    get:
      tags: [Gamification]
      summary: Get the opt-in reliability and recognition leaderboard
      x-access: All
      responses:
        "200":
          description: Leaderboard returned

  /gamification/me/points:
    get:
      tags: [Gamification]
      summary: Get the current employee's points history
      x-access: Self
      responses:
        "200":
          description: Points history returned

  /gamification/me/badges:
    get:
      tags: [Gamification]
      summary: Get the current employee's earned badges
      x-access: Self
      responses:
        "200":
          description: Earned badges returned

  /gamification/vote:
    post:
      tags: [Gamification]
      summary: Cast a weighted monthly or yearly vote
      x-access: All
      responses:
        "201":
          description: Vote recorded

  /simulation/run:
    post:
      tags: [Simulation]
      summary: Run a deterministic leave-impact or resignation-impact scenario
      x-access: Admin/HR
      responses:
        "200":
          description: Simulation result returned

  /simulation/history/{user_id}:
    get:
      tags: [Simulation]
      summary: Get simulation history for a user
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Simulation history returned

  /chatbot/session:
    post:
      tags: [Chatbot]
      summary: Create a chat session
      x-access: Admin/HR
      responses:
        "201":
          description: Chat session created

  /chatbot/message:
    post:
      tags: [Chatbot]
      summary: Send a message and receive a streaming assistant response
      x-access: Admin/HR
      responses:
        "200":
          description: Streaming chatbot response returned

  /chatbot/session/{id}/history:
    get:
      tags: [Chatbot]
      summary: Get message history for a chat session
      x-access: Admin/HR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Chat history returned

  /notifications/me:
    get:
      tags: [Notification]
      summary: Get the current user's in-app notifications
      x-access: Self
      responses:
        "200":
          description: Notification list returned

  /notifications/{id}/read:
    post:
      tags: [Notification]
      summary: Mark a notification as read
      x-access: Self
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification marked as read

  /notifications/preferences:
    get:
      tags: [Notification]
      summary: Get the current user's notification preferences
      x-access: Self
      responses:
        "200":
          description: Notification preferences returned
    put:
      tags: [Notification]
      summary: Update the current user's notification preferences
      x-access: Self
      responses:
        "200":
          description: Notification preferences updated

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
    EmployeeId:
      in: path
      name: employee_id
      required: true
      schema:
        type: integer
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: integer
